name: Quality check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check HTML files
        shell: bash
        run: |
          set -e
          for file in index.html signup.html preview.html; do
            test -f "$file"
            grep -q '<!doctype html>' "$file"
            grep -q '</html>' "$file"
          done
